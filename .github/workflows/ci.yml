name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when new commits arrive on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Points at the Postgres service below.
      DATABASE_URL: postgres://docs:docs@localhost:5432/docs_assistant
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: docs_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs -d docs_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test:e2e
